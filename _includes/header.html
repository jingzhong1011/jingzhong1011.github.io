{%- assign profile = site.data.profile -%}
<header class="site-header">
  <div class="container site-header-inner">
    <a class="site-title" href="{{ "/" | relative_url }}">
      <img src="{{ "/assets/img/icon/logo.svg" | relative_url }}" alt="" class="site-icon">
      {{ site.title | escape }}
    </a>

    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span>
    </button>

    <nav class="site-nav" id="site-nav">
      <a href="{{ "/" | relative_url }}" class="nav-item{% if page.url == "/" %} is-active{% endif %}">About</a>
      <a href="{{ "/research/" | relative_url }}" class="nav-item{% if page.url contains "/research/" %} is-active{% endif %}">Research</a>
      <a href="{{ "/blog/" | relative_url }}" class="nav-item{% if page.url contains "/blog/" or page.layout == "post" %} is-active{% endif %}">Blog</a>
      {%- if profile.cv and profile.cv != "" %}
      <a href="{{ profile.cv | relative_url }}" class="nav-item" target="_blank" rel="noopener">CV</a>
      {%- endif %}
    </nav>
  </div>
</header>
