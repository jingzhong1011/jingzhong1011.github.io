{%- assign profile = site.data.profile -%}
<header class="site-header">
  <div class="container site-header-inner">
    <a class="site-title" href="{{ "/" | relative_url }}">
      <img src="{{ "/assets/img/icon/logo.svg" | relative_url }}" alt="" class="site-icon">
      {{ site.title | escape }}
    </a>

    <div class="header-actions">
    <nav class="site-nav" id="site-nav">
      <a href="{{ "/" | relative_url }}" class="nav-item{% if page.url == "/" %} is-active{% endif %}">About</a>
      <a href="{{ "/research/" | relative_url }}" class="nav-item{% if page.url contains "/research/" %} is-active{% endif %}">Research</a>
      <a href="{{ "/blog/" | relative_url }}" class="nav-item{% if page.url contains "/blog/" or page.layout == "post" %} is-active{% endif %}">Blog</a>
      {%- if profile.cv and profile.cv != "" %}
      <a href="{{ profile.cv | relative_url }}" class="nav-item" target="_blank" rel="noopener">CV</a>
      {%- endif %}
    </nav>

    <button class="theme-toggle" type="button" aria-label="Switch color theme">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.5 14.2A8.5 8.5 0 1 1 9.8 3.5a6.8 6.8 0 0 0 10.7 10.7z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M4.6 4.6l1.6 1.6M17.8 17.8l1.6 1.6M2.5 12h2.2M19.3 12h2.2M4.6 19.4l1.6-1.6M17.8 6.2l1.6-1.6"/></svg>
    </button>

    <button class="nav-toggle" type="button" aria-label="Menu" aria-expanded="false" aria-controls="site-nav">
      <span></span><span></span>
    </button>
    </div>
  </div>
</header>
